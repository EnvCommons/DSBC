name: sandbox-image

# Build (and, on main, publish) the DSBC agent-sandbox image whenever its
# Dockerfile changes. Publishes to Docker Hub as generalreasoning/dsbc_tools,
# tagged :latest and :<git-sha>. dsbc.py points SandboxSettings(image=...) at
# generalreasoning/dsbc_tools:latest.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — a Docker Hub user with push access to the `dsbc` org
#   DOCKERHUB_TOKEN     — a Docker Hub access token for that user
# and the Docker Hub repo generalreasoning/dsbc_tools must exist (public, so the
# OpenReward sandbox provisioner can pull it).

on:
  push:
    branches: [main]
    paths:
      - sandbox/Dockerfile
      - .github/workflows/sandbox-image.yml
  pull_request:
    paths:
      - sandbox/Dockerfile
      - .github/workflows/sandbox-image.yml
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only log in / push on main (and manual runs) — PRs build-only to
      # validate the Dockerfile without needing or exposing the push secrets.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            generalreasoning/dsbc_tools:latest
            generalreasoning/dsbc_tools:${{ github.sha }}
